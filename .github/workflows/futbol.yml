name: Taraftar verisi ve maç izleme

on:
  schedule:
    - cron: "7,37 * * * *"   # her 30 dakikada bir (GitHub birkaç dakika geciktirebilir)
  workflow_dispatch:
    inputs:
      mod:
        description: "Veri güncelleme biçimi"
        type: choice
        options: [otomatik, tam, hizli, devir]
        default: otomatik
      onceki:
        description: "(devir) Devreden izleyicinin çalışma kimliği; izleyici kendisi doldurur, elle kullanma"
        default: ""
      devir_testi_dk:
        description: "Deneme: izleyici bu kadar dakika sonra kendi yerine yenisini başlatıp devretsin (maç yokken de bekler). Boş = normal"
        default: ""

permissions:
  contents: write
  actions: write    # "kontrol" çalışan izleyicileri listeler; izleyici devir için kendi yerine yeni çalışma başlatır

# Tetikleyiciler: GitHub zamanlaması (seyrek) + cron-job.org (30 dk'da bir workflow_dispatch, mod=otomatik).
# Zaten çalışan bir izleyici varken gelen otomatik tetikleme beklemez, "kontrol" işinden sonra hemen biter.
# Elle seçilen tam/hizli güncellemesi atlanmaz; izleyici çalışıyorsa yalnız veriyi günceller, izlemeye karışmaz.
# Devir (arka_plan/devir.py): izleyici 5,5 saat sınırına 15 dk kala, izlenecek maç varsa mod=devir ile yenisini
# başlatır; yenisi hazır olunca durumu devredip kapanır. Bu yüzden "calis" işinde concurrency yok: kısa süre iki
# çalışma üst üste biner ama bildirim yalnız biri gönderir. Aynı anda tek izleyiciyi "kontrol" ve devir sağlar.

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      calistir: ${{ steps.bak.outputs.calistir }}
      izle: ${{ steps.bak.outputs.izle }}
    steps:
      - name: Çalışan izleyici var mı?
        id: bak
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
          BU_CALISMA: ${{ github.run_id }}
          OLAY: ${{ github.event_name }}
          MOD: ${{ inputs.mod }}
        run: |
          if [ "$OLAY" = "workflow_dispatch" ] && [ "$MOD" = "devir" ]; then
            echo "Devir: önceki izleyicinin yerine geçecek."
            { echo "calistir=1"; echo "izle=1"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Yalnız bundan önce başlamış çalışmalara bak: aynı anda gelen iki tetiklemeden eskisi kazanır.
          n=0
          for durum in in_progress queued; do
            k=$(gh api "repos/$DEPO/actions/workflows/futbol.yml/runs?status=$durum&per_page=100" --jq "[.workflow_runs[] | select(.id < $BU_CALISMA)] | length")
            n=$((n + k))
          done
          echo "Önceki, bitmemiş çalışma: $n"
          if [ "$OLAY" = "workflow_dispatch" ] && [ "$MOD" != "otomatik" ]; then
            # elle tam/hizli: her zaman çalışır; izleyici varsa yalnız veriyi günceller
            echo "calistir=1" >> "$GITHUB_OUTPUT"
            [ "$n" = "0" ] && echo "izle=1" >> "$GITHUB_OUTPUT" || echo "izle=0" >> "$GITHUB_OUTPUT"
          elif [ "$n" = "0" ]; then
            { echo "calistir=1"; echo "izle=1"; } >> "$GITHUB_OUTPUT"
          else
            { echo "calistir=0"; echo "izle=0"; } >> "$GITHUB_OUTPUT"
          fi

  calis:
    needs: kontrol
    if: needs.kontrol.outputs.calistir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bildirim kütüphanesini kur
        run: pip install --quiet firebase-admin==7.7.0

      - name: Git kullanıcısını ayarla
        run: |
          git config user.name "taraftar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Elle seçilen veri güncellemesi
        if: github.event_name == 'workflow_dispatch' && (inputs.mod == 'tam' || inputs.mod == 'hizli')
        run: python arka_plan/veri_guncelle.py ${{ inputs.mod }}

      - name: Verileri güncelle ve maçları izle
        env:
          FIREBASE_HESAP: ${{ secrets.FIREBASE_HESAP }}
          NTFY_KONU: ${{ secrets.NTFY_KONU }}
          UYGULAMA_ADRESI: ${{ vars.UYGULAMA_ADRESI }}
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}          # devir: yeni çalışmayı tetikler, önceki çalışmanın durumuna bakar
          SADECE_VERI: ${{ needs.kontrol.outputs.izle == '0' && '1' || '' }}
          DEVIR_ONCEKI: ${{ inputs.onceki }}
          DEVIR_TESTI_DK: ${{ inputs.devir_testi_dk }}
        run: python arka_plan/mac_izle.py
