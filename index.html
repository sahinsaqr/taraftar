<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taraftar</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Takip ettiğin takımların canlı skorları, fikstürü ve puan durumu">
  <meta name="theme-color" content="#1b2d4b">
  <!-- Kaydedilmiş temayı ilk çizimden önce uygula (yanıp sönmeyi önler); app.js'deki temaUygula ile aynı -->
  <script>
    (function () {
      var secim = 'sistem';
      try { secim = JSON.parse(localStorage.getItem('ft_tema')) || 'sistem'; } catch (e) {}
      var acik = secim === 'acik' || (secim === 'sistem' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.tema = acik ? 'acik' : 'koyu';
      document.querySelector('meta[name="theme-color"]').content = acik ? '#eef2f8' : '#1b2d4b';
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taraftar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="icon" href="ikonlar/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">
  <link rel="preload" href="yazitipleri/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="yazitipleri/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Aşağı çekip yenile göstergesi (app.js) -->
  <div class="cek-yenile" id="cekYenile" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <main id="icerik" class="icerik" tabindex="-1"></main>

  <nav class="alt-menu" aria-label="Bölümler">
    <button data-sekme="maclar" class="aktif" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m12 8.2 3.6 2.6-1.4 4.2H9.8l-1.4-4.2z"/><path d="M12 8.2V3M15.6 10.8l4.9-1.6M14.2 15l3 4.2M9.8 15l-3 4.2M8.4 10.8 3.5 9.2"/></svg>
      <span>Maçlar</span>
    </button>
    <button data-sekme="takimlar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.4 2.9 8.2 7 9.8 4.1-1.6 7-5.4 7-9.8V5.8L12 3z"/></svg>
      <span>Takımlar</span>
    </button>
    <button data-sekme="puan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-11M3 20.5h18"/></svg>
      <span>Puan</span>
    </button>
    <button data-sekme="profil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1-3.8 4-5.5 7.5-5.5s6.5 1.7 7.5 5.5"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div class="bildirim-kutusu" id="tost" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
